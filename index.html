<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>配信状況突合ツール - ブラストエンジンですねん</title>
  <!-- 文字コード変換ライブラリ (Shift-JIS出力用) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/encoding-japanese/2.0.0/encoding.min.js"></script>
  <style>
    body { font-family: sans-serif; background-color: #f8f9fa; color: #333; padding: 20px; line-height: 1.5; }
    .container { max-width: 900px; margin: 0 auto; }
    .card { background: #fff; border: 1px solid #dee2e6; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
    
    /* 説明文ボックスのスタイル */
    .instructions {
      background-color: #eef6ff;
      border-left: 4px solid #0d6efd;
      padding: 15px 20px;
      margin-bottom: 20px;
      border-radius: 0 4px 4px 0;
    }
    .instructions h3 {
      margin-top: 0;
      margin-bottom: 8px;
      font-size: 1.05rem;
      color: #0b5ed7;
    }
    .instructions ol {
      margin: 0;
      padding-left: 20px;
    }
    .instructions li {
      margin-bottom: 4px;
    }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .form-group { display: flex; flex-direction: column; }
    label { font-weight: bold; margin-bottom: 8px; }
    input[type="file"] { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    .btn-container { margin-top: 20px; display: flex; gap: 10px; }
    button { padding: 10px 20px; font-size: 1rem; border: none; border-radius: 4px; cursor: pointer; color: #fff; }
    .btn-primary { background-color: #0d6efd; }
    .btn-success { background-color: #198754; }
    button:disabled { background-color: #ccc; cursor: not-allowed; }
    
    .summary-box { display: flex; gap: 20px; margin-top: 15px; }
    .summary-item { padding: 12px 20px; border-radius: 6px; background: #f1f3f5; text-align: center; flex: 1; }
    .summary-item.success { background: #d1e7dd; color: #0f5132; }
    .summary-item.danger { background: #f8d7da; color: #842029; }
    .summary-item .number { font-size: 1.5rem; font-weight: bold; }
    
    .table-container { max-height: 400px; overflow-y: auto; border: 1px solid #dee2e6; margin-top: 15px; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
    th, td { padding: 10px; border-bottom: 1px solid #dee2e6; }
    th { background: #f1f3f5; position: sticky; top: 0; }
    .badge { padding: 3px 8px; border-radius: 12px; font-size: 0.8rem; font-weight: bold; }
    .badge-danger { background-color: #f8d7da; color: #842029; }
    .badge-warning { background-color: #fff3cd; color: #664d03; }
    #loading { display: none; margin-top: 10px; font-weight: bold; color: #0d6efd; }
  </style>
</head>
<body>

<div class="container">
  <h1>ブラストエンジン 配信未完了リスト抽出 (GAS版)</h1>

  <div class="card">
    <!-- 説明文エリア -->
    <div class="instructions">
      <h3>ブラストエンジンログの作成（作成方法）</h3>
      <ol>
        <li>ブラストエンジンログ.csv（共有トップ）を開く。</li>
        <li>ブラストエンジンの「配信ログ」を開き、該当する行（配信IDから応答メッセージまで）をコピーして、CSVに貼り付ける。この時、1行目のタイトルを消さないように注意。</li>
        <li>保存する。</li>
      </ol>
    </div>

    <div class="form-grid">
      <div class="form-group">
        <label>① ブラストエンジンログ (CSV)</label>
        <input type="file" id="blastLogFile" accept=".csv">
      </div>
      <div class="form-group">
        <label>② 送信先リスト (CSV)</label>
        <input type="file" id="targetListFile" accept=".csv">
      </div>
    </div>
    <div class="btn-container">
      <button class="btn-primary" id="processBtn" onclick="submitFiles()">照合を実行</button>
      <button class="btn-success" id="exportBtn" onclick="exportCSV()" disabled>結果をCSVでダウンロード</button>
    </div>
    <div id="loading">処理中... しばらくお待ちください。</div>
  </div>

  <div id="resultSection" class="card" style="display: none;">
    <h2>抽出結果</h2>
    <div class="summary-box">
      <div class="summary-item">
        <div>送信先総件数</div>
        <div class="number" id="totalCount">0</div>
      </div>
      <div class="summary-item success">
        <div>送信完了件数</div>
        <div class="number" id="successCount">0</div>
      </div>
      <div class="summary-item danger">
        <div>未到達・エラー対象</div>
        <div class="number" id="failedCount">0</div>
      </div>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>事業所コード</th>
            <th>送信先名</th>
            <th>メールアドレス</th>
            <th>検出理由</th>
          </tr>
        </thead>
        <tbody id="resultTableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  let filteredResults = [];

  // ファイルをShift_JISで読み込む補助関数
  function readFileAsText(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = e => resolve(e.target.result);
      reader.onerror = e => reject(e);
      reader.readAsText(file, 'Shift_JIS');
    });
  }

  function submitFiles() {
    const blastFile = document.getElementById('blastLogFile').files[0];
    const targetFile = document.getElementById('targetListFile').files[0];

    if (!blastFile || !targetFile) {
      alert('2つのCSVファイルを選択してください。');
      return;
    }

    document.getElementById('loading').style.display = 'block';
    document.getElementById('processBtn').disabled = true;

    Promise.all([readFileAsText(blastFile), readFileAsText(targetFile)]).then(texts => {
      google.script.run
        .withSuccessHandler(onSuccess)
        .withFailureHandler(onFailure)
        .processData(texts[0], texts[1]);
    }).catch(err => {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('processBtn').disabled = false;
      alert('ファイルの読み込みに失敗しました: ' + err);
    });
  }

  function onSuccess(response) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('processBtn').disabled = false;

    if (!response.success) {
      alert('エラーが発生しました:\n' + response.message);
      return;
    }

    filteredResults = response.results;
    
    document.getElementById('resultSection').style.display = 'block';
    document.getElementById('totalCount').textContent = response.totalTargets;
    document.getElementById('successCount').textContent = response.successCount;
    document.getElementById('failedCount').textContent = filteredResults.length;

    const tbody = document.getElementById('resultTableBody');
    tbody.innerHTML = '';

    filteredResults.forEach(item => {
      const tr = document.createElement('tr');
      const isNoLog = item.reason.includes('未到達');
      const badgeClass = isNoLog ? 'badge-danger' : 'badge-warning';

      tr.innerHTML = `
        <td>${escapeHtml(item.code)}</td>
        <td>${escapeHtml(item.name)}</td>
        <td>${escapeHtml(item.email)}</td>
        <td><span class="badge ${badgeClass}">${escapeHtml(item.reason)}</span></td>
      `;
      tbody.appendChild(tr);
    });

    document.getElementById('exportBtn').disabled = filteredResults.length === 0;
  }

  function onFailure(error) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('processBtn').disabled = false;
    alert('通信エラーが発生しました: ' + error.message);
  }

  function escapeHtml(str) {
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // Shift-JIS形式でCSVを出力する関数
  function exportCSV() {
    if (filteredResults.length === 0) return;

    let csvString = '事業所コード,送信先名,メールアドレス\r\n';
    filteredResults.forEach(item => {
      const code = `"${item.code.replace(/"/g, '""')}"`;
      const name = `"${item.name.replace(/"/g, '""')}"`;
      const email = `"${item.email.replace(/"/g, '""')}"`;
      csvString += `${code},${name},${email}\r\n`;
    });

    // Unicode -> Shift_JIS へエンコード変換
    const unicodeArray = Encoding.stringToCode(csvString);
    const sjisArr = Encoding.convert(unicodeArray, {
      to: 'SJIS',
      from: 'UNICODE'
    });

    const uint8Array = new Uint8Array(sjisArr);
    const blob = new Blob([uint8Array], { type: 'text/csv;charset=shift_jis;' });
    
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = `配信未完了リスト_${new Date().toISOString().slice(0,10)}.csv`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }
</script>

</body>
</html>
